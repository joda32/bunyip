name: Build database

# Rebuilds the Bunyip database from upstream sources once a day and publishes it
# as the rolling "db-latest" release, so users can `bunyip pull` instead of
# rebuilding it themselves. Power users can still run `bunyip update` locally.

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write # upload/replace the db-latest release assets

concurrency:
  group: build-db
  cancel-in-progress: false

jobs:
  build-db:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # NVD throttles its feeds hard; the retry loop needs room
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Build the bunyip binary
        run: CGO_ENABLED=0 go build -trimpath -o bunyip ./cmd/bunyip

      # Persist the feed cache across runs. A from-scratch build has to pull ~24
      # yearly NVD feeds, and NVD throttles them hard; SyncNVD re-downloads a feed
      # only when its .meta sha256 changed, so a warm cache turns a daily run into
      # a handful of tiny .meta checks plus the feeds that actually changed
      # (modified, the current year, EPSS/MSF/EDB on other hosts). The run_id key
      # with a prefix restore-key gives a rolling, always-updated cache.
      - name: Restore the feed cache
        uses: actions/cache/restore@v4
        with:
          path: .feedcache
          key: feedcache-v1-${{ github.run_id }}
          restore-keys: |
            feedcache-v1-

      # A cold cache (first run, cache eviction, a new branch) is the only case
      # that has to warm from throttled NVD, and that is what kills the build.
      # Instead warm the historical feeds from the feed-cache release asset over
      # GitHub's CDN, so the update below only fetches the feeds that actually
      # changed (current year + modified). The static years (2002..last year)
      # never change, so a once-built seed stays valid; CI refreshes it after
      # each successful build (below).
      - name: Seed the feed cache from the release
        run: |
          mkdir -p .feedcache
          # The seed holds every static year through last year. If last year's
          # feed is present the static set is complete (a warm, not merely partial,
          # cache), so there is nothing to seed. A partial cache that stopped early
          # is missing it and gets seeded.
          last_year=$(( $(date -u +%Y) - 1 ))
          if [ -f ".feedcache/nvdcve-2.0-$last_year.json.gz" ]; then
            echo "cache already holds the static feeds through $last_year; no seed needed"
            exit 0
          fi
          echo "cold or partial cache; fetching the NVD feed seed from the feed-cache release"
          if gh release download feed-cache -p nvd-feed-cache.tar -D . --clobber; then
            # --skip-old-files keeps any fresher current-year/modified feed the
            # cache already has; the seed only fills the gaps.
            tar --skip-old-files -C .feedcache -xf nvd-feed-cache.tar && rm -f nvd-feed-cache.tar
            echo "seeded $(ls .feedcache/nvdcve-2.0-*.json.gz 2>/dev/null | wc -l) NVD feeds from the release"
          else
            echo "no seed published yet; the update will fetch all feeds from NVD"
          fi

      # --db is a global flag and must precede the subcommand. A download can
      # still stall on a cold or partly-warm cache, so retry the whole update
      # against the one cache dir until it completes. Each attempt skips feeds
      # already fetched, and the cache is saved even on failure (below) so partial
      # progress carries into the next run.
      - name: Build the database from upstream sources
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "::group::update attempt $attempt"
            if ./bunyip --db bunyip.sqlite update --cache .feedcache; then
              echo "::endgroup::"
              echo "update succeeded on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed (likely NVD throttling); cached feeds are kept, retrying in 60s"
            sleep 60
          done
          echo "update did not complete after 6 attempts"
          exit 1

      # Save even on failure so a throttled run that only fetched some feeds still
      # advances the cache for the next run. The run_id key is always new, so the
      # save never collides with an existing entry.
      - name: Save the feed cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .feedcache
          key: feedcache-v1-${{ github.run_id }}

      - name: Verify the database
        run: ./bunyip --db bunyip.sqlite db verify

      # Refresh the seed from this run's known-good feeds (only reached when the
      # build and verify succeeded), so the next cold start is just as cheap and
      # the current-year feed in the seed stays current.
      - name: Refresh the feed cache seed
        run: |
          tar -C .feedcache -cf nvd-feed-cache.tar \
            $(cd .feedcache && ls nvdcve-2.0-*.json.gz nvdcve-2.0-*.meta)
          gh release upload feed-cache nvd-feed-cache.tar --clobber
          rm -f nvd-feed-cache.tar

      - name: Package the database as a bundle
        run: ./bunyip --db bunyip.sqlite bundle create --out bunyip-db.tar.gz

      - name: Checksums and release notes
        run: |
          sha256sum bunyip-db.tar.gz > SHA256SUMS
          {
            echo "Prebuilt Bunyip database, rebuilt daily and installed with \`bunyip pull\`."
            echo
            echo "Built: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo '```'
            ./bunyip --db bunyip.sqlite info
            echo '```'
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md

      - name: Publish to the rolling db-latest release
        run: |
          # Create the rolling release once; afterwards just replace its assets.
          # --latest=false keeps db-latest from displacing code releases (v0.2.0)
          # as the repository's "Latest" release.
          if ! gh release view db-latest >/dev/null 2>&1; then
            gh release create db-latest \
              --title "Latest database" \
              --notes-file notes.md \
              --latest=false \
              bunyip-db.tar.gz SHA256SUMS
          else
            gh release edit db-latest --notes-file notes.md --latest=false
            gh release upload db-latest bunyip-db.tar.gz SHA256SUMS --clobber
          fi
